"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](color_bg1)\
$os\
$username\
[](bg:color_bg3 fg:color_bg1)\
$directory\
[](fg:color_bg3 bg:color_bg2)\
$git_branch\
$git_status\
[](fg:color_bg2 bg:color_bg1)\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$python\
[](fg:color_bg1 bg:color_bg0)\
$docker_context\
[](fg:color_bg0)\
$line_break\
$character"""

palette = 'adwaita_dark'

[palettes.adwaita_dark]
color_fg0 = '#deddda'
color_bg0 = '#1a5fb4'
color_bg1 = '#26a269'
color_bg2 = '#63452c'
color_bg3 = '#5e5c64'

[os]
disabled = false
style = "bg:color_bg3 fg:color_fg0"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[username]
show_always = true
style_user = "bg:color_bg3 fg:color_fg0"
style_root = "bg:color_bg3 fg:color_fg0"
format = '[ $user ]($style)'

[directory]
style = "fg:color_fg0 bg:color_bg3"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:color_bg2"
format = '[[ $symbol $branch ](fg:color_fg0 bg:color_bg2)]($style)'

[git_status]
style = "bg:color_bg2"
format = '[[($all_status$ahead_behind )](fg:color_fg0 bg:color_bg2)]($style)'

[nodejs]
symbol = ""
style = "bg:color_bg1"
format = '[[ $symbol ($version) ](fg:color_fg0 bg:color_bg1)]($style)'

[c]
symbol = " "
style = "bg:color_bg1"
format = '[[ $symbol ($version) ](fg:color_fg0 bg:color_bg1)]($style)'

[rust]
symbol = ""
style = "bg:color_bg1"
format = '[[ $symbol ($version) ](fg:color_fg0 bg:color_bg1)]($style)'

[golang]
symbol = ""
style = "bg:color_bg1"
format = '[[ $symbol ($version) ](fg:color_fg0 bg:color_bg1)]($style)'

[php]
symbol = ""
style = "bg:color_bg1"
format = '[[ $symbol ($version) ](fg:color_fg0 bg:color_bg1)]($style)'

[java]
symbol = ""
style = "bg:color_bg1"
format = '[[ $symbol ($version) ](fg:color_fg0 bg:color_bg1)]($style)'

[python]
symbol = ""
style = "bg:color_bg1"
format = '[[ $symbol ($version) ](fg:color_fg0 bg:color_bg1)]($style)'

[docker_context]
symbol = ""
style = "bg:color_bg0"
format = '[[ $symbol( $context) ](fg:#83a598 bg:color_bg0)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[❯](bold fg:color_bg1)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:color_bg1)'
