# ============================================================
# TMUX ÍCARO LIRA — configuração definitiva
# Portátil, sem plugins obrigatórios, pensada para Fedora/UFCG
# ============================================================

# ---------- Prefixo ----------
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# ---------- Terminal / mouse ----------
set -g default-terminal "tmux-256color"
# Truecolor (24-bit): cobre o xterm-256color explicitamente (Tc é o sinal
# clássico que o Vim também reconhece) e, por segurança, qualquer terminal
# "*256col*" (a maioria dos terminais modernos, mesmo os que não anunciam
# suporte a truecolor por conta própria — é a mesma lógica do fix aplicado
# no Vim pra parar de "feio" fora do kitty).
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",xterm-kitty:RGB"
set -ag terminal-overrides ",*256col*:Tc"
set -g mouse on
set -g focus-events on
set -g escape-time 10
set -g history-limit 50000
set -g renumber-windows on

# ---------- Performance ----------
set -s escape-time 0
set -g repeat-time 600
set -g display-time 2500

# ---------- Índices ----------
set -g base-index 1
setw -g pane-base-index 1

# ============================================================
# JANELAS
# ============================================================

# Nova janela no diretório atual
bind c new-window -c "#{pane_current_path}"

# Última janela
bind Tab last-window

# Navegar por número
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9

# Próxima/anterior
bind n next-window
bind p previous-window

# Shift + setas: trocar janela
bind -n C-S-Left previous-window
bind -n C-S-Right next-window

# Renomear janela
bind , command-prompt -I "#W" "rename-window '%%'"

# ============================================================
# PAINÉIS
# ============================================================

# Dividir verticalmente (lado a lado)
bind-key "|" split-window -h -c "#{pane_current_path}"
bind-key "=" split-window -h -c "#{pane_current_path}"

# Dividir horizontalmente (cima/baixo)
bind - split-window -v -c "#{pane_current_path}"

# Navegação
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Também funciona sem prefixo
bind -n M-Left select-pane -L
bind -n M-Down select-pane -D
bind -n M-Up select-pane -U
bind -n M-Right select-pane -R

# Redimensionar com H J K L
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# Redimensionar com Alt + setas
bind -n M-S-Left resize-pane -L 5
bind -n M-S-Down resize-pane -D 5
bind -n M-S-Up resize-pane -U 5
bind -n M-S-Right resize-pane -R 5

# Maximizar/restaurar painel
bind z resize-pane -Z
bind m resize-pane -Z

# Seleção rápida
bind o select-pane -t :.+
bind q display-panes

# Trocar layout
bind Space next-layout

# Fechar painel/janela
bind x confirm-before -p "Fechar painel? (y/n)" kill-pane
bind & confirm-before -p "Fechar janela? (y/n)" kill-window

# ============================================================
# COPY MODE — estilo Vim
# ============================================================

setw -g mode-keys vi
bind Escape copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# ============================================================
# UTILIDADES
# ============================================================

# Sincronizar todos os painéis
bind q setw synchronize-panes \; display-message "Sync: #{?pane_synchronized,ON,OFF}"

# Recarregar
bind r source-file ~/.tmux.conf \; display-message "✓ TMUX Ícaro Lira recarregado"

# Mostrar atalhos
bind ? display-popup -E -w 80% -h 80% \
    "printf '\\033[1;36mTMUX ÍCARO LIRA\\033[0m\\n\\n'; \
     printf '\\033[1mPAINÉIS\\033[0m\\n'; \
     printf '  C-a |      dividir horizontal\\n  C-a -      dividir vertical\\n'; \
     printf '  C-a h/j/k/l navegar\\n  M-setas     navegar\\n'; \
     printf '  C-a H/J/K/L redimensionar\\n  C-a z        maximizar/restaurar\\n\\n'; \
     printf '\\033[1mJANELAS\\033[0m\\n'; \
     printf '  C-a c      nova janela\\n  C-a Tab      última janela\\n'; \
     printf '  C-a n/p    próxima/anterior\\n  C-S-setas   trocar janela\\n'; \
     printf '  C-a ,      renomear\\n\\n'; \
     printf '\\033[1mGERAL\\033[0m\\n'; \
     printf '  C-a q      sincronizar painéis\\n  C-a r      recarregar\\n'; \
     printf '  C-a d      sair da sessão\\n  C-a ?      esta ajuda\\n'; \
     read -n 1 -s -r -p \"Pressione qualquer tecla para sair...\""
# Barra: mostrar/esconder
bind -n C-Space set -g status

# ============================================================
# STATUS BAR
# ============================================================

set -g status on
set -g status-interval 1
set -g status-position bottom
set -g status-justify left

# Espaçamento
set -g status-left-length 40
set -g status-right-length 100

# Cores/estilo — terminal padrão, sem plugins
set -g status-style "bg=colour235,fg=colour250"
set -g message-style "bg=colour235,fg=colour51"
set -g message-command-style "bg=colour235,fg=colour51"

# Esquerda: identidade
set -g status-left "#[fg=colour16,bg=colour51,bold]  TMUX ÍCARO LIRA #[fg=colour51,bg=colour235]"

# Janelas
setw -g window-status-format " #[fg=colour245]#I #[fg=colour250]#W "
setw -g window-status-current-format "#[fg=colour16,bg=colour51,bold] #I  #W #[fg=colour51,bg=colour235]"

# Direita
set -g status-right "#[fg=colour245]#{session_name} #[fg=colour239]│ #[fg=colour245]#{host_short} #[fg=colour239]│ #[fg=colour250]%d/%m/%Y #[fg=colour239]│ #[fg=colour51,bold]%H:%M:%S "

# Bordas dos painéis
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour51"

# Indicador de pane
set -g display-panes-active-colour colour51
set -g display-panes-colour colour245

# Títulos
set -g pane-border-status top
set -g pane-border-format " #[fg=colour245]#P #[fg=colour51]#{pane_title} #[fg=colour239]│ #[fg=colour245]#{pane_current_path} "

# Mensagens
set -g status-left-style "bold"
set -g status-right-style "bold"

# ============================================================
# AMBIENTE
# ============================================================

# Mantém EDITOR/VISUAL se definidos
if-shell '[ -z "$EDITOR" ]' 'set-environment -g EDITOR vim'
if-shell '[ -z "$VISUAL" ]' 'set-environment -g VISUAL vim'
